<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="One lesson a day from philosophers, Stoics and modern thinkers.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Daily Lessons</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">Daily Lessons</h1>
    <nav class="tabs" role="tablist">
      <button class="tab is-active" data-view="lesson" role="tab" aria-selected="true">Lessons</button>
      <button class="tab" data-view="favorites" role="tab" aria-selected="false">Favorites</button>
    </nav>
  </header>

  <main>
    <section id="view-lesson" class="view">
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>

      <article class="card" id="card" aria-live="polite">
        <p class="badge" id="badge"></p>
        <blockquote class="lesson" id="lesson-text"></blockquote>
        <p class="figure" id="lesson-figure"></p>
        <p class="category" id="lesson-category"></p>
      </article>

      <div class="actions">
        <button class="icon-btn" id="btn-prev" aria-label="Previous lesson">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="icon-btn" id="btn-fav" aria-label="Add to favorites" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 5C19 15.6 12 20 12 20z"/></svg>
        </button>
        <button class="icon-btn" id="btn-share" aria-label="Share lesson">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
        </button>
        <button class="primary-btn" id="btn-next">Next</button>
      </div>
      <button class="link-btn" id="btn-today" hidden>Back to today's lesson</button>
      <p class="hint">Swipe left or right to browse</p>
    </section>

    <section id="view-favorites" class="view" hidden>
      <ul class="fav-list" id="fav-list"></ul>
      <p class="empty" id="fav-empty">No favorites yet. Tap the heart on a lesson to save it here.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
